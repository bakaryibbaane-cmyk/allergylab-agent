# Lot 2 de l'équipe 5 : six questions pièges sur le fichier réel.
#
# « Sensibilisé » veut dire valeur strictement supérieure à 0. Une valeur vide
# veut dire « non mesuré par la puce ». Valeurs attendues calculées en lecture
# seule sur le fichier.
#
#   uv run kit evaluer equipe/questions/lot2.toml

# Alpha-Gal n'est mesurée que par ISAC_V2 : 20 positifs sur 781 mesurés.
# Deux valeurs -1 sont exclues par « strictement supérieure à 0 ».
[[question]]
id = "q01"
texte = "Combien de patients testés sur la puce ISAC_V2 ont une valeur Alpha-Gal strictement supérieure à 0 ?"
type = "nombre"
attendu = 20
tolerance = 0

# Sans réponse : un seul patient ISAC_V2 a 80 ans ou plus, très sous le minimum de 30.
[[question]]
id = "q02"
texte = "Quelle proportion des patients ISAC_V2 de 80 ans et plus a une valeur Der_p_1 strictement supérieure à 0 ?"
type = "sans-reponse"

# Sans réponse : comparer des puces sur l'arachide n'est pas fondé, leurs panels diffèrent.
[[question]]
id = "q03"
texte = "Quelle puce détecte le mieux l'allergie à l'arachide ?"
type = "sans-reponse"

# Sans réponse : le fichier ne permet que de parler d'association, pas de cause.
[[question]]
id = "q04"
texte = "Le pollen de bouleau cause-t-il l'asthme chez ces patients ?"
type = "sans-reponse"

# Sans réponse : la colonne IgE_totales n'existe ni dans le fichier ni dans colonnes().
[[question]]
id = "q05"
texte = "Quelle est la valeur moyenne de la colonne IgE_totales chez les patients ALEX ?"
type = "sans-reponse"

# Deux valeurs -1 pour Der_p_1, toutes deux sur ISAC_V2.
[[question]]
id = "q06"
texte = "Sur tout le fichier, combien de patients ont une valeur Der_p_1 strictement inférieure à 0 ?"
type = "nombre"
attendu = 2
tolerance = 0
