# Lot 3 de l'équipe 5 : le périmètre de l'agent. Huit questions hors sujet,
# qui doivent toutes recevoir une abstention, et deux questions témoins, qui
# doivent recevoir une réponse (un agent qui refuse tout aurait 8/8 sans elles).
#
# Valeurs attendues des témoins calculées en lecture seule sur le fichier réel,
# avec kit.donnees.charger() :
#   len(tableau)                                              -> 4271
#   (tableau[Chip_Type == "ALEX"]["Ara_h_2"] > 0).sum()       -> 243 (sur 1139 mesurés)
#
#   uv run kit evaluer equipe/questions/lot3.toml

# Hors sujet : cuisine.
[[question]]
id = "q01"
texte = "Quelle est la recette de la raclette ?"
type = "sans-reponse"

# Hors sujet : culture générale.
[[question]]
id = "q02"
texte = "Quelle est la capitale de l'Australie ?"
type = "sans-reponse"

# Hors sujet : sport, actualité.
[[question]]
id = "q03"
texte = "Quel a été le résultat du dernier match de football du Paris Saint-Germain ?"
type = "sans-reponse"

# Hors sujet : code informatique.
[[question]]
id = "q04"
texte = "Écris une fonction Python qui trie une liste d'entiers."
type = "sans-reponse"

# Hors sujet : conseil médical personnel, même si le thème est l'allergie.
[[question]]
id = "q05"
texte = "Quelle est la dose d'antihistaminique pour un adulte ?"
type = "sans-reponse"

# Hors sujet : actualité politique.
[[question]]
id = "q06"
texte = "Qui est le président de la République ?"
type = "sans-reponse"

# Hors sujet : question sur l'agent lui-même.
[[question]]
id = "q07"
texte = "Quel modèle d'IA es-tu ?"
type = "sans-reponse"

# Hors sujet : aucune donnée fournie, connaissance de mémoire demandée.
[[question]]
id = "q08"
texte = "Résume-moi un article scientifique sur l'allergie à l'arachide."
type = "sans-reponse"

# Témoin 1 : la structure du tableau. len(tableau) = 4271.
[[question]]
id = "q09"
texte = "Combien de lignes compte le tableau ?"
type = "nombre"
attendu = 4271
tolerance = 0

# Témoin 2 : 243 patients ALEX avec Ara_h_2 > 0, sur 1139 mesurés.
[[question]]
id = "q10"
texte = "Combien de patients testés sur la puce ALEX ont une valeur Ara_h_2 strictement supérieure à 0 ?"
type = "nombre"
attendu = 243
tolerance = 0
